<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kahvisota, alustakoe</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117;
		color: #e8ecf2; font-family: system-ui, sans-serif; touch-action: none; }
	#peli { display: block; width: 100%; height: 100%; touch-action: none; }
	#mittari { position: fixed; top: 0; left: 0; right: 0; z-index: 5; padding: 6px 8px;
		background: rgba(0,0,0,.72); color: #7ee08a; font-family: monospace;
		font-size: 12px; line-height: 1.5; pointer-events: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="peli"></canvas>
<div id="mittari">kaynnistyy</div>
<script>
// Alustakoe. Ei Godotia, ei WebAssemblya, ei WebGL:aa. Sama kentta ja sama
// maara liikkuvia hahmoja kuin oikeassa pelissa, piirrettyna selaimen omalla
// kaksiulotteisella piirtopinnalla. Tarkoitus on mitata yksi asia: pysyyko
// tavallinen JavaScript-canvaspeli pystyssa talla puhelimella.
const kanvaasi = document.getElementById('peli');
const ctx = kanvaasi.getContext('2d');
const mittari = document.getElementById('mittari');

const LEVEYS = 720, KORKEUS = 1280;
let skaala = 1, siirtoX = 0, siirtoY = 0;

function mitoita() {
	const dpr = Math.min(window.devicePixelRatio || 1, 3);
	kanvaasi.width = Math.round(kanvaasi.clientWidth * dpr);
	kanvaasi.height = Math.round(kanvaasi.clientHeight * dpr);
	skaala = Math.min(kanvaasi.width / LEVEYS, kanvaasi.height / KORKEUS);
	siirtoX = (kanvaasi.width - LEVEYS * skaala) / 2;
	siirtoY = (kanvaasi.height - KORKEUS * skaala) / 2;
}
window.addEventListener('resize', mitoita);
mitoita();

// Kentan pysyva maisema piirretaan kerran omaan puskuriin, kuten oikeassa
// pelissakin. Tama on se tapa jolla 2D-peli tehdaan mobiilille.
const pohja = document.createElement('canvas');
pohja.width = LEVEYS; pohja.height = 1040;
(function leivoPohja() {
	const p = pohja.getContext('2d');
	const liuku = p.createLinearGradient(0, 0, 0, 1040);
	liuku.addColorStop(0, '#ccd9e8'); liuku.addColorStop(1, '#eef3f8');
	p.fillStyle = liuku; p.fillRect(0, 0, LEVEYS, 1040);
	p.fillStyle = '#3d6fa5'; p.fillRect(0, 470, LEVEYS, 100);
	p.fillStyle = '#e8f2fb'; p.fillRect(0, 464, LEVEYS, 8);
	p.fillRect(0, 570, LEVEYS, 8);
	for (const bx of [176, 544]) {
		p.fillStyle = '#7a5433'; p.fillRect(bx - 46, 430, 92, 180);
		p.fillStyle = 'rgba(255,255,255,.75)'; p.fillRect(bx - 46, 430, 92, 6);
	}
	p.strokeStyle = 'rgba(255,255,255,.55)'; p.lineWidth = 30;
	for (const bx of [176, 544]) {
		p.beginPath(); p.moveTo(bx, 120); p.lineTo(bx, 430); p.stroke();
		p.beginPath(); p.moveTo(bx, 610); p.lineTo(bx, 920); p.stroke();
	}
	for (let i = 0; i < 34; i++) {
		const x = i < 17 ? 16 : LEVEYS - 16;
		const y = 40 + ((i % 17) * 60);
		p.fillStyle = '#2f6b45';
		p.beginPath(); p.moveTo(x, y - 26); p.lineTo(x - 16, y + 10); p.lineTo(x + 16, y + 10);
		p.closePath(); p.fill();
		p.fillStyle = '#5a3f28'; p.fillRect(x - 3, y + 10, 6, 10);
	}
	for (let i = 0; i < 60; i++) {
		p.fillStyle = 'rgba(255,255,255,.55)';
		p.beginPath();
		p.ellipse(((i * 97) % LEVEYS), ((i * 173) % 1040), 12, 5, 0, 0, 6.283);
		p.fill();
	}
})();

const yksikot = [];
for (let i = 0; i < 12; i++) {
	yksikot.push({
		x: 80 + (i % 4) * 180, y: 200 + (i % 3) * 260,
		vx: (i % 2 ? 1 : -1) * (20 + i * 3), vy: (i % 3 ? 1 : -1) * (18 + i * 2),
		oma: i % 2 === 0, vaihe: i * 0.7,
	});
}
const hiutaleet = [];
for (let i = 0; i < 70; i++) {
	hiutaleet.push({ x: (i * 131) % LEVEYS, y: (i * 271) % 1040, v: 14 + (i % 9) * 3, k: 1 + (i % 3) });
}

function hahmo(p, u, aika) {
	const vari = u.oma ? '#3f7fd6' : '#d2503f';
	const heilu = Math.sin(aika * 9 + u.vaihe) * 4;
	p.fillStyle = 'rgba(0,0,0,.16)';
	p.beginPath(); p.ellipse(u.x, u.y + 14, 13, 5, 0, 0, 6.283); p.fill();
	p.fillStyle = vari; p.fillRect(u.x - 9, u.y - 12, 18, 20);
	p.fillStyle = '#f5d3b0'; p.beginPath(); p.arc(u.x, u.y - 18, 8, 0, 6.283); p.fill();
	p.fillStyle = '#243044';
	p.fillRect(u.x - 8 + heilu * 0.4, u.y + 8, 6, 10);
	p.fillRect(u.x + 2 - heilu * 0.4, u.y + 8, 6, 10);
	p.fillStyle = vari; p.fillRect(u.x - 14, u.y - 8 + heilu, 5, 14);
	p.fillRect(u.x + 9, u.y - 8 - heilu, 5, 14);
	p.fillStyle = '#1c2430'; p.fillRect(u.x - 14, u.y - 30, 28, 4);
	p.fillStyle = '#6fd08a'; p.fillRect(u.x - 14, u.y - 30, 20, 4);
}

let edellinen = performance.now(), aika = 0, ruutuja = 0, fps = 0, mitattu = performance.now();

function ruutu(nyt) {
	const dt = Math.min((nyt - edellinen) / 1000, 0.1);
	edellinen = nyt; aika += dt; ruutuja++;

	for (const u of yksikot) {
		u.x += u.vx * dt; u.y += u.vy * dt;
		if (u.x < 40 || u.x > LEVEYS - 40) u.vx *= -1;
		if (u.y < 60 || u.y > 980) u.vy *= -1;
	}
	for (const h of hiutaleet) { h.y += h.v * dt * 6; if (h.y > 1040) h.y = -4; }

	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.fillStyle = '#0d1117';
	ctx.fillRect(0, 0, kanvaasi.width, kanvaasi.height);
	ctx.setTransform(skaala, 0, 0, skaala, siirtoX, siirtoY);
	ctx.drawImage(pohja, 0, 0);
	for (const u of yksikot) hahmo(ctx, u, aika);
	ctx.fillStyle = 'rgba(255,255,255,.55)';
	for (const h of hiutaleet) { ctx.beginPath(); ctx.arc(h.x, h.y, h.k, 0, 6.283); ctx.fill(); }
	ctx.fillStyle = '#161d27';
	ctx.fillRect(0, 1040, LEVEYS, 240);
	ctx.fillStyle = '#d8b661';
	for (let i = 0; i < 8; i++) {
		ctx.fillRect(8 + (i % 4) * 178, 1060 + Math.floor(i / 4) * 92, 168, 82);
	}

	if (nyt - mitattu >= 1000) { fps = ruutuja; ruutuja = 0; mitattu = nyt; }
	mittari.textContent =
		'ALUSTAKOE, ei Godotia eika WebGL:aa\n'
		+ 'fps: ' + fps + '   ruutu: ' + kanvaasi.width + 'x' + kanvaasi.height
		+ '   dpr ' + (window.devicePixelRatio || 1) + '\n'
		+ 'hahmoja 12, hiutaleita 70, tausta leivottu kerran';
	requestAnimationFrame(ruutu);
}
requestAnimationFrame(ruutu);
</script>
</body>
</html>

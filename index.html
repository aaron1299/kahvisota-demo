<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

	<title>Kahvisota</title>

	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #0d1117;
			color: #e8ecf2;
			font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
			touch-action: none;
			overscroll-behavior: none;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			outline: none;
			background: #0d1117;
			touch-action: none;
			-webkit-tap-highlight-color: transparent;
		}
		#lataus {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 18px;
			background: #0d1117;
			z-index: 10;
			transition: opacity .35s ease;
		}
		#lataus.piiloon { opacity: 0; pointer-events: none; }
		#nimi { font-size: 30px; font-weight: 700; letter-spacing: .12em; }
		#alaotsikko { font-size: 14px; color: #8b94a3; }
		#palkki { width: min(70vw, 320px); height: 8px; border-radius: 4px; background: #1c2430; overflow: hidden; }
		#palkki > div { height: 100%; width: 0%; background: #2a6ac8; transition: width .2s ease; }
		#mittari {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 20;
			display: none;
			padding: 6px 8px;
			background: rgba(0,0,0,.72);
			color: #7ee08a;
			font-family: monospace;
			font-size: 12px;
			line-height: 1.5;
			pointer-events: none;
			white-space: pre-wrap;
		}
		#virhe {
			position: fixed;
			left: 50%;
			top: 14%;
			transform: translateX(-50%);
			z-index: 40;
			display: none;
			max-width: 80vw;
			padding: 14px 18px;
			border-radius: 8px;
			background: #3a2126;
			border: 1px solid #7c3b44;
			font-size: 14px;
			line-height: 1.4;
			text-align: center;
			white-space: pre-wrap;
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas" tabindex="0">Your browser does not support the canvas element.</canvas>

	<div id="lataus">
		<div id="nimi">KAHVISOTA</div>
		<div id="alaotsikko">loading the arena</div>
		<div id="palkki"><div id="palkki-taytto"></div></div>
	</div>

	<!-- Virheilmoitus on latausruudun ULKOPUOLELLA. Latausruutu poistetaan
	     DOM:sta kun peli kaynnistyy, ja sisalla oleva ilmoitus katosi sen
	     mukana, jolloin kaynnistyksen jalkeiset virheet jaivat nakymatta. -->
	<div id="virhe"></div>


	<div id="mittari"></div>

	<noscript>This game requires JavaScript.</noscript>

	<script src="index.js?v=5c3db1055c"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":152640,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;

		// Kanvaasi seuraa ikkunaa. Peli itse pitaa 9:16-kuvasuhteen ja
		// palkittaa reunat, joten sama sivu toimii puhelimessa ja iframessa.
		GODOT_CONFIG['canvasResizePolicy'] = 2;

		const engine = new Engine(GODOT_CONFIG);
		const lataus = document.getElementById('lataus');
		const taytto = document.getElementById('palkki-taytto');
		const virhe = document.getElementById('virhe');

		// Ulkopuolinen valvonta: operaattorin sivu ja testit voivat lukea
		// tasta, onko peli oikeasti kaynnissa.
		window.kahvisota = { tila: 'lataa', ruutuja: 0, virhe: null };

		function naytaVirhe(e) {
			console.error(e);
			virhe.style.display = 'block';
			virhe.textContent = (e && e.message) ? e.message : String(e);
			window.kahvisota.tila = 'virhe';
			window.kahvisota.virhe = virhe.textContent;
		}

		// Latausruutu suomeksi vain jos osoitteessa on lang=fi. Oletus on
		// englanti, koska demolinkki menee useimmiten ulkomaille ja
		// latausteksti on ensimmainen asia jonka vastaanottaja nakee.
		const suomeksi = location.search.indexOf('lang=fi') !== -1
			|| (location.search.indexOf('lang=') === -1
				&& (navigator.language || 'en').toLowerCase().indexOf('fi') === 0);
		if (suomeksi) {
			document.documentElement.lang = 'fi';
			document.getElementById('alaotsikko').textContent = 'ladataan areenaa';
		}

		// WebGL-konteksti voi kadota puhelimessa muistipaineessa. Silloin peli
		// jatkaa ajamista mutta kuva jaa viimeiseen ruutuun. Ilman tata
		// kasittelya se nayttaa taysin samalta kuin jumittunut peli.
		window.kahvisotaGL = 'ok';
		document.getElementById('canvas').addEventListener('webglcontextlost', function (e) {
			e.preventDefault();
			window.kahvisotaGL = 'menetetty';
			naytaVirhe(new Error(suomeksi
				? 'Selain vapautti pelin grafiikkamuistin. Lataa sivu uudelleen.'
				: 'The browser released the graphics context. Please reload the page.'));
			// Kerran ladataan sivu automaattisesti uudelleen. Useampi kerta
			// olisi silmukka, joten kaynti kirjataan istuntoon.
			try {
				if (!sessionStorage.getItem('kahvisota_uudelleen')) {
					sessionStorage.setItem('kahvisota_uudelleen', '1');
					setTimeout(function () { location.reload(); }, 1200);
				}
			} catch (e) { /* yksityinen tila, jatetaan lataamatta */ }
		}, false);
		document.getElementById('canvas').addEventListener('webglcontextrestored', function () {
			window.kahvisotaGL = 'palautettu';
		}, false);

		// Vianetsintamittari. Nakyy vain osoitteella ?debug=1. Kertoo erikseen
		// montako kosketusta sivu saa, montako niista paatyy moottoriin ja
		// piirtaako peli uusia ruutuja. Nailla kolmella luvulla nakee heti,
		// kaatuuko mobiilikaytto selaimeen, moottoriin vai pelilogiikkaan.
		if (location.search.indexOf('debug=1') !== -1) {
			const mittari = document.getElementById('mittari');
			mittari.style.display = 'block';
			let sivunKosketukset = 0;
			let viimeinenTyyppi = '-';
			const kanvaasi = document.getElementById('canvas');
			['touchstart', 'pointerdown', 'mousedown'].forEach((t) => {
				kanvaasi.addEventListener(t, (e) => {
					sivunKosketukset += 1;
					viimeinenTyyppi = t + (e.pointerType ? '/' + e.pointerType : '');
				}, { capture: true, passive: true });
			});
			// Selaimen oma ruudunpaivitys. Jos tama kay 60:aa mutta pelin
			// piirtolaskuri ei liiku, vika on pelissa. Jos tamakin ryomii,
			// selain kuristaa koko sivun.
			let rafRuutuja = 0;
			let rafHz = 0;
			(function laske() { rafRuutuja += 1; requestAnimationFrame(laske); })();
			setInterval(() => { rafHz = rafRuutuja; rafRuutuja = 0; }, 1000);
			// Ratkaiseva erotteleva koe. Kanvaasin oma piirtopuskuri luetaan
			// 16 x 16 -kokoon pienennettyna ja katsotaan muuttuuko se.
			// elava  = puskuri paivittyy, kuva on jaassa vasta nayton puolella
			// JAASSA = esityskopio ei laskeudu lainkaan
			const nayte = document.createElement('canvas');
			nayte.width = 16;
			nayte.height = 16;
			const nayteCtx = nayte.getContext('2d', { willReadFrequently: true });
			let edellinenTiiviste = null;
			let puskuriMuutoksia = 0;
			let puskuriTila = '?';
			setInterval(() => {
				try {
					nayteCtx.drawImage(kanvaasi, 0, 0, 16, 16);
					const d = nayteCtx.getImageData(0, 0, 16, 16).data;
					let h = 0;
					for (let i = 0; i < d.length; i += 4) {
						h = (h * 31 + d[i] + d[i + 1] * 3 + d[i + 2] * 7) | 0;
					}
					if (edellinenTiiviste !== null && h !== edellinenTiiviste) {
						puskuriMuutoksia += 1;
					}
					edellinenTiiviste = h;
					puskuriTila = puskuriMuutoksia > 0 ? ('elava ' + puskuriMuutoksia) : 'JAASSA';
				} catch (e) {
					puskuriTila = 'ei luettavissa';
				}
			}, 500);

			// Pelin oma ruutunopeus erikseen selaimen taajuudesta.
			let edellinenSekunti = 0;
			let pelinFps = 0;
			setInterval(() => {
				const nyt = (window.kahvisota && window.kahvisota.ruutuja) || 0;
				pelinFps = nyt - edellinenSekunti;
				edellinenSekunti = nyt;
			}, 1000);

			let edellinenRuutu = -1;
			let jumissa = 0;
			setInterval(() => {
				const k = window.kahvisota || {};
				if (k.ruutuja === edellinenRuutu) { jumissa += 1; } else { jumissa = 0; }
				edellinenRuutu = k.ruutuja;
				mittari.textContent =
					'sivu sai kosketuksia: ' + sivunKosketukset + '  (' + viimeinenTyyppi + ')\n'
					+ 'peli sai syotteita: ' + (k.syotteita === undefined ? 'EI TIETOA' : k.syotteita)
					+ '  ' + (k.syote || '-') + '\n'
					+ 'ruutuja piirretty: ' + (k.ruutuja === undefined ? 'EI TIETOA' : k.ruutuja)
					+ (jumissa > 2 ? '  PYSAHTYNYT' : '  kay') + '\n'
					+ 'pelin fps: ' + pelinFps + '   selain paivittaa: ' + rafHz + '/s\n'
					+ 'piirtopuskuri: ' + puskuriTila + '   grafiikka: ' + (window.kahvisotaGL || '?') + '\n'
					+ 'nakyma: ' + (k.nakyma || k.tila || '-')
					+ '   dpr ' + (window.devicePixelRatio || 1)
					+ '   ' + Math.round(kanvaasi.getBoundingClientRect().width) + 'x'
					+ Math.round(kanvaasi.getBoundingClientRect().height)
					+ ' / ' + kanvaasi.width + 'x' + kanvaasi.height;
			}, 400);
		}

		// Puhelin tunnistetaan yha, mutta vain kuvan paivityksen pakottamista
		// varten. Peli kaynnistyy puhelimessa normaalisti.
		const kayttajaAgentti = navigator.userAgent || '';
		const puhelin = /iPhone|iPod|Android.*Mobile/.test(kayttajaAgentti)
			|| (/iPad|Macintosh/.test(kayttajaAgentti) && navigator.maxTouchPoints > 1)
			|| (window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820);

		window.kahvisotaPuhelin = puhelin;

		// Pikselitiheyden pakottamista kokeiltiin kahdesti. Arvo 1 teki kuvasta
		// sumean, ja arvo 2 siirsi WebGL-kontekstin menetyksen kesken pelin
		// sijaan jo latausvaiheeseen, koska Godot mitoittaa kanvaasin itse ja
		// vaarennetty tiheys sotkee sen. Tiheys jatetaan nayton omaksi.

		function kaynnista() {
			// Puhelimessa 40 megatavun paketti voi jaada lataamaan pitkaksi
			// aikaa tai loppua muistiin. Kerrotaan se kayttajalle sen sijaan
			// etta han tuijottaisi liikkumatonta palkkia.
			const hidasVaroitus = setTimeout(() => {
				const a = document.getElementById('alaotsikko');
				if (a) {
					a.textContent = suomeksi
						? 'lataus kestää tavallista kauemmin, paketti on 40 Mt'
						: 'this is taking longer than usual, the build is 40 MB';
				}
			}, 25000);
			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						const osuus = Math.round(100 * current / total);
						taytto.style.width = osuus + '%';
						const a = document.getElementById('alaotsikko');
						if (a) {
							a.textContent = (suomeksi ? 'ladataan areenaa ' : 'loading the arena ') + osuus + ' %';
						}
					}
				},
			}).then(() => {
				clearTimeout(hidasVaroitus);
				taytto.style.width = '100%';
				lataus.classList.add('piiloon');
				setTimeout(() => lataus.remove(), 400);
				window.kahvisota.tila = 'kaynnissa';
				document.getElementById('canvas').focus();
				// iOS ei aina paivita WebGL-kerrosta naytolle, vaikka peli
				// piirtaa. Mitaton opasiteetin heilutus merkitsee kerroksen
				// likaiseksi joka ruudulla ja pakottaa uudelleenkomposition.
				// Opasiteetti valittiin siksi, ettei se muuta canvasin
				// sijaintia, johon Godotin kosketuskartoitus perustuu.
				// Osoitteen ?nyi=0 sammuttaa taman vertailua varten.
				if (puhelin && location.search.indexOf('nyi=0') === -1) {
					const kv = document.getElementById('canvas');
					let vuoro = 0;
					(function nyi() {
						vuoro ^= 1;
						kv.style.opacity = vuoro ? '1' : '0.999';
						requestAnimationFrame(nyi);
					})();
				}
			}, naytaVirhe);
		}

		const puuttuu = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (puuttuu.length !== 0) {
			naytaVirhe(new Error('This browser is missing:\n' + puuttuu.join('\n')));
		} else {
			kaynnista();
		}
	</script>
</body>
</html>
